name: YouTube AI Channel Tracker

on:
  schedule:
    - cron: '0 4,10 * * *'
  workflow_dispatch:

jobs:
  update-tracker:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Update README with latest videos
        run: python3 .github/scripts/update_tracker.py

      - name: Commit and push if changed
        run: |
          git config user.name  "AI Video Tracker Bot"
          git config user.email "ai-tracker-bot@github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update YouTube tracker $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi